name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: pip install dnspython cryptography

      - name: Compile check
        run: python -m compileall -q .

      - name: Unit test
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          python phishscan.py --version
          python phishscan.py --help

      - name: Scan test
        run: |
          PHISHSCAN_YES=1 python phishscan.py --json "https://example.com" | tee out.json
          python -c "import json; d = json.load(open('out.json')); assert 'score' in d and 'verdict' in d"
